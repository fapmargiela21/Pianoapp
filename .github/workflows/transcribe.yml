# A YouTube link from the app (workflow_dispatch, audio fetched via Apify) or a recording
# committed to inbox/ is transcribed with Transkun (tools/audio2song); the song is committed.
name: Transcribe uploaded recordings
on:
  push:
    paths: ['inbox/*.json']
  workflow_dispatch:
    inputs:
      url:
        description: 'YouTube link (piano version)'
        required: false
      title:
        description: 'Song title (optional, the video title otherwise)'
        required: false
permissions:
  contents: write
  pages: write
concurrency:
  group: transcribe-${{ github.ref }}
  cancel-in-progress: false
jobs:
  transcribe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: tools/audio2song/requirements.txt
      - name: Install ffmpeg and Transkun
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
          pip install -q -r tools/audio2song/requirements.txt
      - name: Download from YouTube
        if: ${{ inputs.url }}
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          URL: ${{ inputs.url }}
          TITLE: ${{ inputs.title }}
        run: python3 tools/audio2song/youtube.py "$URL" "$TITLE"
      - name: Transcribe
        run: python3 tools/audio2song/inbox.py
      - name: Check songs
        continue-on-error: true
        run: node tools/check-songs.mjs
      - name: Commit
        run: |
          git config user.name "piano-transcriber"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A songs inbox
          git diff --cached --quiet && exit 0
          git commit -m "Transcribed uploaded recording(s)"
          for i in 1 2 3; do git pull -q --rebase origin "$GITHUB_REF_NAME" && git push -q origin "HEAD:$GITHUB_REF_NAME" && exit 0; sleep 5; done
          exit 1
      - name: Rebuild GitHub Pages
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/$GITHUB_REPOSITORY/pages/builds" >/dev/null
